[project]
name = "reelforge"
version = "0.1.0"
description = "Autonomous marketing-video pipeline for AI voice receptionist company"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlmodel>=0.0.18",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "soundfile>=0.12.1",
    "pyloudnorm>=0.1.1",
    "pydub>=0.25.1",
    "kokoro-onnx>=0.3.0",
    "onnxruntime>=1.17.0",
    "faster-whisper>=1.0.0",
    "boto3>=1.34.0",
    "python-telegram-bot>=21.0",
    "apscheduler>=3.10.4",
    "rich>=13.7.1",
    "pytest>=8.0.0",
    "respx>=0.21.1",
    "psutil>=5.9.8",
]

[project.scripts]
reelforge = "reelforge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reelforge"]
